# Fabrique les applis « Bestioles » (Android ; Windows et Linux) et les publie dans la page Releases du dépôt (tag « bestioles »),
# avec l'accord de l'utilisateur.
name: Bestioles
on:
  push:
    branches: [main]
    paths: ['bestioles/**', '.github/workflows/bestioles.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bestioles
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'
      - name: Clé de signature (secret BESTIOLES_CLE : « mot-de-passe clé-en-base64 »)
        env:
          BESTIOLES_CLE: ${{ secrets.BESTIOLES_CLE }}
        run: |
          if [ -n "$BESTIOLES_CLE" ]; then
            echo "$BESTIOLES_CLE" | cut -d' ' -f2 | base64 -d > "$RUNNER_TEMP/cle.p12"
            echo "::add-mask::$(echo "$BESTIOLES_CLE" | cut -d' ' -f1)"
            echo "CLE_MDP=$(echo "$BESTIOLES_CLE" | cut -d' ' -f1)" >> "$GITHUB_ENV"
            echo "CLE_FICHIER=$RUNNER_TEMP/cle.p12" >> "$GITHUB_ENV"
            echo "Clé fixe utilisée"
          else
            echo "Pas de secret BESTIOLES_CLE : clé de débogage"
          fi
      - name: Fabriquer l'APK
        run: gradle -p bestioles/android assembleRelease --no-daemon --stacktrace
      - name: Renommer
        run: cp bestioles/android/app/build/outputs/apk/release/app-release.apk Bestioles-android.apk
      - uses: actions/upload-artifact@v6
        with:
          name: Bestioles-android
          path: Bestioles-android.apk

  bureau:
    strategy:
      matrix:
        include:
          - os: windows-latest
            cible: --win portable
            fichier: Bestioles-windows.exe
          - os: ubuntu-latest
            cible: --linux AppImage
            fichier: Bestioles-linux.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Préparer la page des bestioles
        shell: bash
        run: cp -r bestioles/moteur bestioles/bureau/page && mkdir -p bestioles/bureau/jeu && cp web/index.html bestioles/bureau/jeu/index.html
      - name: Fabriquer
        shell: bash
        working-directory: bestioles/bureau
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm install --no-audit --no-fund
          npx electron-builder ${{ matrix.cible }} --publish never
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.fichier }}
          path: bestioles/bureau/dist/${{ matrix.fichier }}

  publier:
    needs: [android, bureau]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: fichiers
          merge-multiple: true
      - name: Publier dans « Releases »
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la fichiers
          gh release view bestioles >/dev/null 2>&1 || gh release create bestioles --title "Bestioles" --notes "Petites bêtes de Vivariom qui se promènent sur l'écran, par-dessus les applis. Android : Bestioles-android.apk (widget, réglages rapides). Windows : Bestioles-windows.exe (icône près de l'horloge). Linux : Bestioles-linux.AppImage. © 2026 grecdel — tous droits réservés."
          gh release upload bestioles fichiers/Bestioles-android.apk fichiers/Bestioles-windows.exe fichiers/Bestioles-linux.AppImage --clobber
