# Fabrique les applis « Bestioles » (Android ; Windows et Linux). Les fichiers sont à télécharger depuis l'onglet Actions (connecté au compte).
name: Bestioles
on:
  push:
    branches: [main]
    paths: ['bestioles/**', '.github/workflows/bestioles.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bestioles
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'
      - name: Fabriquer l'APK
        run: gradle -p bestioles/android assembleRelease --no-daemon --stacktrace
      - name: Renommer
        run: cp bestioles/android/app/build/outputs/apk/release/app-release.apk Bestioles-android.apk
      - uses: actions/upload-artifact@v6
        with:
          name: Bestioles-android
          path: Bestioles-android.apk
