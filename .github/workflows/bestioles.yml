# Fabrique les applis « Bestioles » (Android ; Windows et Linux). Les fichiers sont à télécharger depuis l'onglet Actions (connecté au compte).
name: Bestioles
on:
  push:
    branches: [main]
    paths: ['bestioles/**', '.github/workflows/bestioles.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bestioles
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'
      - name: Fabriquer l'APK
        run: gradle -p bestioles/android assembleRelease --no-daemon --stacktrace
      - name: Renommer
        run: cp bestioles/android/app/build/outputs/apk/release/app-release.apk Bestioles-android.apk
      - uses: actions/upload-artifact@v6
        with:
          name: Bestioles-android
          path: Bestioles-android.apk

  bureau:
    strategy:
      matrix:
        include:
          - os: windows-latest
            cible: --win portable
            fichier: Bestioles-windows.exe
          - os: ubuntu-latest
            cible: --linux AppImage
            fichier: Bestioles-linux.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Préparer la page des bestioles
        shell: bash
        run: cp -r bestioles/moteur bestioles/bureau/page
      - name: Fabriquer
        shell: bash
        working-directory: bestioles/bureau
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm install --no-audit --no-fund
          npx electron-builder ${{ matrix.cible }} --publish never
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.fichier }}
          path: bestioles/bureau/dist/${{ matrix.fichier }}
